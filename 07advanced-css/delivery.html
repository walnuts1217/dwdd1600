<body>
    <!-- start the page header -->
    <header>
        <img src="images/logo-1.png" alt="logo" width="88" height="100">
        <span>Rock Delivery </span>
    </header>
    
    <!-- start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">About Us</a></li>

    <!-- start the page main -->
    <main>
        <h1>request a delivery</h1>

        <form method="get" class="myForm" action="thank you.html">
            <fieldset>
                <legend>customer Information</legend>
            <label>First Name*<input type="text" name="fname" required></lable>

            <label>last Name*<input type="text" name="lname" required></lable>

            <label>cell number*<input type="tel" name="phone" required placeholder="345-245-9236"></lable>

            <label>Email*<input type="text" name="email" required placeholder="johndoe@gmail.com"></label>
            </fieldset>

            <fieldset>
            <legend> Delivery Methods </legend>
                <label><input type="radio" name="method" value="drone">drone delivery (2hrs)</lable>
                
                <label><input type="radio" name="method"
                value="cycle">motorcycle (4hrs)</label>

                <label><input type="radio" name="method"
                value="mail">mail/post (6hrs)</label>
            </fieldset>

            <fieldset>
            <legend> Delivery Options</legend>
                <input type="checkbox" name="porch" value="chosen">
                Front Porch</lable>

                <input type="checkbox" name="deck" value="chosen">
                Back deck</lable>

                <input type="checkbox" name="driveway" value="chosen">
                driveway</lable>

                <input type="checkbox" name="garage" value="chosen">
                inside garage</lable>

                <label"> Preferred Delivery time
                <select name="time">
                <option value="none"> please seclect</option>
                <option value="morning">between 7:00am and 11:00am</option>
                <option value="noon">between 11:00am and 2:00pm</option>
                <option value="afternoon">between 2:00pm and 5:00pm</option>
                <option value="evening">between 5:00pm and 8:00pm</option>
                <option value="midnight">between 8:00pm and 12:00am</option>
                <option value="whitching hour">between 3:00am and 4:00am</option>
                </select>
                </label>
            </fieldset>

            <label>comments
                <textarea name="comments"> </textarea>
            </label>
        <input type="submit" value="send delivery request">
        </form>
    </main>
